name: CI

on:
  pull_request:
    branches: [developer, main]
  push:
    branches: [developer, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    env:
      # O build não chama a API; a URL só precisa existir para o bundle ser gerado.
      NEXT_PUBLIC_API_URL: https://api.example.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # O next build gera o next-env.d.ts (tipos de .svg etc.), por isso o typecheck vem depois dele.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npx tsc --noEmit -p .
